syntax = "proto3";

package dfsha;

// ======================= Superpeer =======================
service Superpeer {
  // ----- Cliente -> Superpeer: autenticación -----
  // Login es el único RPC de cliente que no lleva token. Los demás lo envían en la metadata
  // "authorization: Bearer <token>", así que sus mensajes no cambian.
  rpc Login(LoginRequest) returns (LoginReply);      // mount al arrancar: usuario/contraseña -> token

  // ----- Cliente -> Superpeer: espacio de nombres (comentario: operación del mount que lo usa) -----
  rpc Stat(PathRequest) returns (Attr);              // getattr: ls, cd, stat
  rpc ListDir(PathRequest) returns (DirListing);     // readdir: ls, find
  rpc MakeDir(PathRequest) returns (Empty);          // mkdir
  rpc RemoveDir(PathRequest) returns (Empty);        // rmdir
  rpc Delete(PathRequest) returns (Empty);           // unlink: rm
  rpc Rename(RenameRequest) returns (Empty);         // rename: mv
  rpc CreateFile(PathRequest) returns (Empty);       // create: touch, primer paso de cp

  // ----- Peer -> Superpeer: membresía -----
  rpc RegisterPeer(PeerInfo) returns (RegisterPeerReply);    // al arrancar el peer
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);  // cada pocos segundos: "sigo vivo"

  // ----- Inspección (pruebas, demo) -----
  rpc ListPeers(Empty) returns (PeerList);                   // estado de todos los peers conocidos

  // ----- Cliente -> Superpeer: bloques -----
  rpc GetBlockLocations(PathRequest) returns (BlockList);    // open: qué bloques forman el archivo y dónde están
  rpc AllocateBlocks(AllocateRequest) returns (BlockList);   // antes de subir: el plan (bloques nuevos y sus peers)
  rpc CommitFile(CommitRequest) returns (Empty);             // después de subir: la versión nueva se vuelve visible
}

// ======================= Peer =======================
// La API de cada peer: guardar, entregar y borrar bloques por su ID (y Ping para verificar la dirección).
service Peer {
  rpc Ping(Empty) returns (Empty);                      // superpeer -> peer: ¿responde la dirección anunciada?
  rpc WriteBlock(WriteBlockRequest) returns (Empty);    // cliente -> peer: guardar un bloque (reintentar es seguro)
  rpc ReadBlock(BlockRequest) returns (BlockData);      // cliente -> peer: leer un bloque
  rpc DeleteBlock(BlockRequest) returns (Empty);        // superpeer -> peer: borrar un bloque obsoleto (idempotente)
}

// ======================= Mensajes comunes =======================

message Empty {}      // respuesta sin datos: el éxito es simplemente no recibir un error

// ======================= Autenticación =======================

message LoginRequest {
  string username = 1;
  string password = 2;           // solo viaja aquí, y debe ir por un canal cifrado (TLS)
}

message LoginReply {
  string token = 1;                  // JWT firmado por el superpeer; se adjunta en cada RPC
  double expires_in_seconds = 2;     // cuánto dura; al vencer, el cliente vuelve a hacer Login
}

// ======================= Espacio de nombres =======================

message PathRequest {
  string path = 1;
}

message RenameRequest {
  string source_path = 1;
  string destination_path = 2;
}

message Attr {
  bool   is_dir = 1;
  int64  size   = 2;
  double mtime  = 3;
}

message DirListing {
  repeated string names = 1;     // "repeated" = a list
}

// ======================= Peers =======================

message PeerInfo {
  string peer_id = 1;            // nombre único del peer, p. ej. "peer1"
  string address = 2;            // dónde lo encuentran el superpeer y los clientes, p. ej. "peer1:7100"
  int64  capacity_bytes = 3;     // espacio total que ofrece para bloques
}

message RegisterPeerReply {
  double heartbeat_interval_seconds = 1;   // cada cuánto debe enviar Heartbeat (lo decide el superpeer)
  bytes  token_public_key = 2;             // PEM: con ella el peer verifica los permisos de bloque (no puede fabricarlos)
}

message HeartbeatRequest {
  string peer_id = 1;
  int64  free_bytes = 2;         // espacio libre en este momento
}

message HeartbeatReply {
  bool known = 1;                // false: el superpeer no conoce este peer (p. ej. se reinició) -> registrarse de nuevo
}

message PeerStatus {             // lo que ListPeers informa de cada peer
  string peer_id = 1;
  string address = 2;
  int64  capacity_bytes = 3;
  int64  free_bytes = 4;
  double seconds_since_heartbeat = 5;
  bool   alive = 6;              // false si lleva demasiado tiempo sin heartbeat
}

message PeerList {
  repeated PeerStatus peers = 1;
}

// ======================= Bloques: peer =======================

message BlockRequest {
  string block_id = 1;           // 32 caracteres hexadecimales, generado por el registro
  string access_token = 2;       // permiso de lectura que entregó el superpeer (ReadBlock); DeleteBlock no lo usa
}

message WriteBlockRequest {
  string block_id = 1;
  bytes  data = 2;               // hasta un bloque (1 MiB): cabe en el límite de 4 MB por mensaje de gRPC
  string access_token = 3;       // permiso de escritura que entregó el superpeer en el plan
}

message BlockData {
  bytes data = 1;
}

// ======================= Bloques: superpeer =======================

message Replica {                // un peer que tiene (o tendrá) una copia del bloque
  string peer_id = 1;            // lo que guarda el registro
  string address = 2;            // dónde conectarse; lo agrega el superpeer con su tabla de peers
}

message BlockLocation {
  string block_id = 1;
  int64  size = 2;
  repeated Replica replicas = 3; // GetBlockLocations: peers vivos primero
  string access_token = 4;       // permiso firmado para este bloque: escritura en AllocateBlocks, lectura en
                                 // GetBlockLocations. El cliente lo presenta al peer en WriteBlock/ReadBlock
}

message BlockList {
  repeated BlockLocation blocks = 1;   // en orden: el byte N está en blocks[N / block_size]
  int64 block_size = 2;
}

message AllocateRequest {
  string path = 1;
  int64  size = 2;               // tamaño total del archivo nuevo
}

message CommitRequest {
  string path = 1;
  int64  size = 2;
  repeated BlockLocation blocks = 3;   // en cada bloque, solo las réplicas que SÍ se escribieron
}
