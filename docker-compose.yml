services:
  sp1:
    build: .
    command: python superpeer.py --id sp1 --port 7000 --demo
    volumes: [".:/app"]

  # Peers: mismo código, cada uno con su id, su nombre en la red y su propio volumen de bloques
  peer1:
    build: .
    command: python peer.py --id peer1 --host peer1 --port 7100 --superpeer sp1:7000 --capacity-mb 1024 --data-dir /data
    volumes: [".:/app", "peer1-data:/data"]
    depends_on: [sp1]

  peer2:
    build: .
    command: python peer.py --id peer2 --host peer2 --port 7100 --superpeer sp1:7000 --capacity-mb 1024 --data-dir /data
    volumes: [".:/app", "peer2-data:/data"]
    depends_on: [sp1]

  peer3:
    build: .
    command: python peer.py --id peer3 --host peer3 --port 7100 --superpeer sp1:7000 --capacity-mb 1024 --data-dir /data
    volumes: [".:/app", "peer3-data:/data"]
    depends_on: [sp1]

  client:
    build: .
    command: python mount.py sp1:7000 /mnt/dfsha
    volumes: [".:/app"]
    environment: ["DFSHA_DEBUG=1"]
    devices: ["/dev/fuse"]
    cap_add: ["SYS_ADMIN"]
    security_opt: ["apparmor:unconfined"]
    depends_on: [sp1]
    restart: on-failure

volumes:           # carpetas de bloques: sobreviven a docker compose down, se borran con down -v
  peer1-data:
  peer2-data:
  peer3-data:
