services:
  sp1:
    build: .
    command: python superpeer.py --id sp1 --port 7000 --demo
    # /data/registry: log y snapshot del registro, sobreviven a reinicios y a docker compose down
    volumes: [".:/app", "sp1-data:/data"]

  peer1:
    build: .
    command: python peer.py --id peer1 --host peer1 --port 7100 --superpeer sp1:7000 --capacity-mb 1024 --data-dir /data
    volumes: [".:/app", "peer1-data:/data"]
    depends_on: [sp1]

  client:
    build: .
    command: python mount.py sp1:7000 /mnt/dfsha
    volumes: [".:/app"]
    environment: ["DFSHA_DEBUG=1"]
    devices: ["/dev/fuse"]
    cap_add: ["SYS_ADMIN"]
    security_opt: ["apparmor:unconfined"]
    depends_on: [sp1]
    restart: on-failure

volumes:
  peer1-data:     # carpeta de bloques de peer1: sobrevive a docker compose down, se borra con down -v
  sp1-data:       # registro persistente del superpeer (log + snapshot)
